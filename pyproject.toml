[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "smelt"
dynamic = ["version"]
description = "Binary orchestrator for Python packages"
requires-python = ">=3.12"
authors = [{ name = "Baptiste Pestourie" }]
readme = "README.md"
dependencies = ["setuptools", "ziglang"]

[project.scripts]
smelt = "smelt.frontend:smelt"

[project.urls]
Homepage = "https://github.com/Hedwyn/smelt"

[project.optional-dependencies]
# mypy[mypyc] is capped below 1.19 on Python 3.15+: 1.19 made `librt` (a compiled
# runtime accelerator) an unconditional dependency, and the `librt` wheels on PyPI
# as of this pin are not ABI-compatible with 3.15 pre-releases -- `import
# mypyc.build` (smelt.backend's own import of it) raises `SystemError: module
# librt.internal uses unknown slot ID 85` before anything else runs. Below 1.19
# there is no `librt` dependency at all. Lift the cap once mypy ships
# 3.15-compatible `librt` wheels.
tests = ["pytest", "mypy[mypyc]; python_version < '3.15'", "mypy[mypyc]<1.19; python_version >= '3.15'"]
mypyc = ["mypy[mypyc]; python_version < '3.15'", "mypy[mypyc]<1.19; python_version >= '3.15'"]
cli = ["click"]
# patchelf: Nuitka needs it for RPATH rewrites in standalone/onefile mode on Linux;
# bundling a known-good build keeps smelt self-contained rather than relying on the
# host distro's version. Capped below 0.18 because Nuitka blacklists patchelf 0.18.0
# (a buggy upstream release); the 0.17.2.x line is the current good stable series.
# nuitka: capped below 4.2 -- smelt's shared-runtime build (nuitkaify.py) patches
# Nuitka's generated `HelpersConstantsBlob.c`/`constants_blob.h` by exact source-text
# match; Nuitka 4.2 changed `loadConstantsBlob`'s signature (return type and the blob
# symbol naming), breaking that match. Raise the cap once the patch is updated for it.
nuitka = ["nuitka<4.2", "patchelf>=0.17.2,<0.18; sys_platform == 'linux'"]
cython = ["Cython"]
# metapython: builds smelt's own CPython through Zig (`smelt build-dist --python own`,
# see smelt.own_python). Pinned to a commit rather than a version, like the pins above,
# because it is not on PyPI and its build.zig options are what smelt codes against:
# 5ebc889 was the first commit carrying the `pyconfig-header` and `strip` options
# own_python.py passes, b3fa35c the first that installs a `_sysconfigdata_*` module --
# without it `sysconfig.get_paths()`, `pydoc`, `help()` and `site.getsitepackages()`
# fail in every interpreter smelt builds, tailored or not -- e78aeca is the first
# that can actually be built: b3fa35c's `build.zig` imports a `build/sysconfigdata.zig`
# that had not been committed, so every cold-cache interpreter build from it died on
# `error: adding build_root build/sysconfigdata.zig to cache failed: FileNotFound`.
# Nothing noticed for three days because a build that hits smelt's own prefix cache
# never evaluates `build.zig` at all. 27183a9 is the first that exposes a standalone
# `configure` build step (`BuildStep.CONFIGURE`) -- `own_python.py`'s
# `_resolve_pyconfig_header` imports it directly, so anything older than this fails
# with `AttributeError: type object 'BuildStep' has no attribute 'CONFIGURE'`.
# 0812d8e is the first that makes `./configure` itself cross-aware (real
# `--host=`/`--build=` for a CPU-arch cross target, not just for musl) and applies
# the resulting `CROSS_FIXUPS`/`ArchProfile` pyconfig.h patches automatically --
# see cpu_cross_compile_pyconfig_plan.md. Anything older produces a pyconfig.h that
# is silently wrong (not an error) for any target whose CPU differs from the host's.
# 1b625dc replaces the single hard-coded `cpython` submodule with a
# `-Dcpython-version=<name>` build option, fetching one of several curated CPython
# releases (see build.zig.zon) as a lazy Zig dependency instead -- this is what lets
# `own_python.py`'s `python_version` parameter pick a CPython other than 3.12.
# 8046ab2 fixes 1b625dc itself, which shipped broken: the `vendoring/` dir (OpenSSL,
# sqlite3, lzma sources) was missing from `force-include` so no packaged install ever
# had it, `vendoring/openssl` was never committed at all despite 1b625dc's own message
# claiming it was, both the CPython and OpenSSL fetch hashes in build.zig.zon were
# stale for the Zig version `metapython.fetch` actually downloads (fails with
# "hash mismatch"), and the OpenSSL build hard-coded an archive wrapper directory this
# Zig strips. Anything between 1b625dc and 8046ab2 fails outright, for every target.
# 04775e3 is the first that can build CPython 3.13+ at all: `Tools/build/deepfreeze.py`
# (used by `Utils.addDeepfreeze`) needs three CPython-version-conditional patches --
# an `isinstance` check narrowed by a since-3.13 mypy cleanup (gh-133403) that dropped
# the `umarshal.Code` branch this project's own frozen-header input actually needs, a
# `ROOT = os.path.dirname(...)` path assumption that only holds at the file's original
# on-disk depth, and calls to `_PyStaticCode_Init`/`_PyStaticCode_Fini`, removed from
# CPython itself in gh-108716 years before 3.13 shipped. Anything older produces
# `TypeError: Cannot generate code for Code object`, a `FileNotFoundError` for
# `pycore_global_strings.h`, or `error: call to undeclared function` for any
# `python_version` other than 3.12.
# 868951e adds `python_version="3.14.2"` support: `Tools/build/umarshal.py` and
# `deepfreeze.py` gain a `slice`-constant decode/codegen path for CPython 3.14's new
# `TYPE_SLICE` marshal type, `deepfreeze.py`'s generated `.co_framesize` initializer
# gets the `pycore_interpframe.h` include 3.14 moved `FRAME_SPECIALS_SIZE` into, `_blake2`
# links CPython 3.14's new HACL Blake2 SIMD source files (previously silently missing,
# `ImportError: undefined symbol: _Py_LibHacl_Hacl_Hash_Blake2s_free`), and a Makefile
# per-object-flags parsing bug is fixed that dropped `-DHACL_CAN_COMPILE_VEC128`/`_VEC256`
# for those same SIMD objects (`error: unknown type name 'Lib_IntVector_Intrinsics_vec128'`).
# Anything older cannot build `python_version="3.14.2"` at all.
# 7b9d097 adds `python_version="3.15.0rc2"` support (no 3.15.0 final tarball exists on
# python.org yet -- only pre-releases through rc2; re-pin once final ships).
# `Tools/build/deepfreeze.py` gained a new `import consts_getter` for a helper CPython
# 3.15 split out of it, needing the same-directory-sibling treatment `umarshal.py` already
# got, and `consts_getter.py`'s own `ROOT = Path(__file__).resolve().parents[2]`
# needed the real absolute path baked in, the same wrong-directory-depth problem
# `deepfreeze.py` itself already had fixed. Anything older cannot build
# `python_version="3.15.0rc2"` at all.
# 6d2756d fixes two bugs 7b9d097's own `python_version="3.15.0rc2"` support hit on a
# CPU-arch cross build (e.g. `own-python-target="arm-linux-gnueabihf"`): the curated
# `3.14.2` entry (fetched as a build-time bootstrap interpreter, regardless of which
# `-Dcpython-version` is actually being built) pointed at python.org, whose CDN served
# that one tarball as different bytes on different requests -- re-pointed at CPython's
# own GitHub tag archive, stable across repeated fetches. And `Utils.writeBuildPythonStub`
# handed `./configure --with-build-python=` a `cpython_dir`-prefixed path while also
# running `./configure` itself with `cwd` already set to `cpython_dir` -- doubling the
# path for a `-Dcpython-version=` dependency, whose `cpython_dir` this pinned Zig's
# project-local `zig-pkg/` cache does not hand back absolute. `configure` reported
# `invalid or missing build python binary` for any CPU-arch cross build regardless of
# `python_version`, since `writeBuildPythonStub` is unconditional whenever cross_arch is
# true. Anything older hits one or both of these for `own-python-target`
# `arm-linux-gnueabihf` (or any other CPU-arch cross target).
metapython = ["metapython @ git+ssh://git@github.com/Hedwyn/meta-python.git@6d2756d"]
# unearth: PDM's wheel-finder library, the fetch engine behind `isolated-build`
# (smelt.isolated_build) -- resolves and downloads a wheel for a target platform
# without needing to actually run there. packaging: listed explicitly (not just relied
# on as unearth's own transitive dependency) since smelt.isolated_build imports it
# directly too, to parse [project.dependencies] specifiers.
isolated-build = ["unearth", "packaging"]
# puccinialin: installs a standalone rustup/cargo (no system Rust needed), the same
# "fully standalone toolchain" goal `ziglang` already gets smelt for C/C++/Zig --
# see smelt.rust.toolchain. maturin: the Rust/Python build frontend smelt.rust.maturin
# drives against that toolchain, cross-linking through smelt's own `ziglang` dependency
# via maturin's own `--zig` flag instead of a system C toolchain.
rust = ["puccinialin", "maturin"]
build = [
  "Cython",
  "nuitka[onefile]<4.2",
  "patchelf>=0.17.2,<0.18; sys_platform == 'linux'",
  # capped below 1.19 on Python 3.15+: see the `mypyc` extra's own comment above.
  "mypy[mypyc]; python_version < '3.15'",
  "mypy[mypyc]<1.19; python_version >= '3.15'",
  "hatchling",
  "editables",
  "metapython @ git+ssh://git@github.com/Hedwyn/meta-python.git@6d2756d",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools_scm]

[tool.setuptools.package-data]
# There's on pyconfig.h per platform + python combination
# Path is pyconfig/platform/python/pyconfig.h
"smelt.pyconfig" = ["*/*/pyconfig.h"]
# The onefile launcher is Zig source compiled at packing time (smelt.onefile), not at
# install time -- it has to ship with the package or `--onefile --python own` has
# nothing to build.
"smelt" = ["launcher/*.zig"]
# smelt.vendoring's own build.zig recipes (see smelt/vendoring/libffi/) are compiled
# at isolated-build time, same reasoning as the onefile launcher above.
"smelt.vendoring" = ["libffi/*.zig", "libffi/*.zig.zon"]

[project.entry-points.hatch]
smelt = "smelt.build_backends.hatch"
