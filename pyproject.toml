[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "smelt"
dynamic = ["version"]
description = "Binary orchestrator for Python packages"
requires-python = ">=3.12"
authors = [{ name = "Baptiste Pestourie" }]
readme = "README.md"
dependencies = ["setuptools", "ziglang"]

[project.scripts]
smelt = "smelt.frontend:smelt"

[project.urls]
Homepage = "https://github.com/Hedwyn/smelt"

[project.optional-dependencies]
tests = ["pytest", "mypy[mypyc]"]
mypyc = ["mypy[mypyc]"]
cli = ["click"]
# patchelf: Nuitka needs it for RPATH rewrites in standalone/onefile mode on Linux;
# bundling a known-good build keeps smelt self-contained rather than relying on the
# host distro's version. Capped below 0.18 because Nuitka blacklists patchelf 0.18.0
# (a buggy upstream release); the 0.17.2.x line is the current good stable series.
# nuitka: capped below 4.2 -- smelt's shared-runtime build (nuitkaify.py) patches
# Nuitka's generated `HelpersConstantsBlob.c`/`constants_blob.h` by exact source-text
# match; Nuitka 4.2 changed `loadConstantsBlob`'s signature (return type and the blob
# symbol naming), breaking that match. Raise the cap once the patch is updated for it.
nuitka = ["nuitka<4.2", "patchelf>=0.17.2,<0.18; sys_platform == 'linux'"]
cython = ["Cython"]
# metapython: builds smelt's own CPython through Zig (`smelt build-dist --python own`,
# see smelt.own_python). Pinned to a commit rather than a version, like the pins above,
# because it is not on PyPI and its build.zig options are what smelt codes against:
# 5ebc889 was the first commit carrying the `pyconfig-header` and `strip` options
# own_python.py passes, b3fa35c the first that installs a `_sysconfigdata_*` module --
# without it `sysconfig.get_paths()`, `pydoc`, `help()` and `site.getsitepackages()`
# fail in every interpreter smelt builds, tailored or not -- e78aeca is the first
# that can actually be built: b3fa35c's `build.zig` imports a `build/sysconfigdata.zig`
# that had not been committed, so every cold-cache interpreter build from it died on
# `error: adding build_root build/sysconfigdata.zig to cache failed: FileNotFound`.
# Nothing noticed for three days because a build that hits smelt's own prefix cache
# never evaluates `build.zig` at all. 27183a9 is the first that exposes a standalone
# `configure` build step (`BuildStep.CONFIGURE`) -- `own_python.py`'s
# `_resolve_pyconfig_header` imports it directly, so anything older than this fails
# with `AttributeError: type object 'BuildStep' has no attribute 'CONFIGURE'`.
# 0812d8e is the first that makes `./configure` itself cross-aware (real
# `--host=`/`--build=` for a CPU-arch cross target, not just for musl) and applies
# the resulting `CROSS_FIXUPS`/`ArchProfile` pyconfig.h patches automatically --
# see cpu_cross_compile_pyconfig_plan.md. Anything older produces a pyconfig.h that
# is silently wrong (not an error) for any target whose CPU differs from the host's.
# 1b625dc replaces the single hard-coded `cpython` submodule with a
# `-Dcpython-version=<name>` build option, fetching one of several curated CPython
# releases (see build.zig.zon) as a lazy Zig dependency instead -- this is what lets
# `own_python.py`'s `python_version` parameter pick a CPython other than 3.12.
# 8046ab2 fixes 1b625dc itself, which shipped broken: the `vendoring/` dir (OpenSSL,
# sqlite3, lzma sources) was missing from `force-include` so no packaged install ever
# had it, `vendoring/openssl` was never committed at all despite 1b625dc's own message
# claiming it was, both the CPython and OpenSSL fetch hashes in build.zig.zon were
# stale for the Zig version `metapython.fetch` actually downloads (fails with
# "hash mismatch"), and the OpenSSL build hard-coded an archive wrapper directory this
# Zig strips. Anything between 1b625dc and 8046ab2 fails outright, for every target.
metapython = ["metapython @ git+ssh://git@github.com/Hedwyn/meta-python.git"]
# unearth: PDM's wheel-finder library, the fetch engine behind `isolated-build`
# (smelt.isolated_build) -- resolves and downloads a wheel for a target platform
# without needing to actually run there. packaging: listed explicitly (not just relied
# on as unearth's own transitive dependency) since smelt.isolated_build imports it
# directly too, to parse [project.dependencies] specifiers.
isolated-build = ["unearth", "packaging"]
build = [
  "Cython",
  "nuitka[onefile]<4.2",
  "patchelf>=0.17.2,<0.18; sys_platform == 'linux'",
  "mypy[mypyc]",
  "hatchling",
  "editables",
  "metapython @ git+ssh://git@github.com/Hedwyn/meta-python.git@8046ab2",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools_scm]

[tool.setuptools.package-data]
# There's on pyconfig.h per platform + python combination
# Path is pyconfig/platform/python/pyconfig.h
"smelt.pyconfig" = ["*/*/pyconfig.h"]
# The onefile launcher is Zig source compiled at packing time (smelt.onefile), not at
# install time -- it has to ship with the package or `--onefile --python own` has
# nothing to build.
"smelt" = ["launcher/*.zig"]

[project.entry-points.hatch]
smelt = "smelt.build_backends.hatch"
