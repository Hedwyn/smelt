[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "smelt"
dynamic = ["version"]
description = "Binary orchestrator for Python packages"
requires-python = ">=3.12"
authors = [{ name = "Baptiste Pestourie" }]
readme = "README.md"
dependencies = ["setuptools", "ziglang"]

[project.scripts]
smelt = "smelt.frontend:smelt"

[project.urls]
Homepage = "https://github.com/Hedwyn/smelt"

[project.optional-dependencies]
tests = ["pytest", "mypy[mypyc]"]
mypyc = ["mypy[mypyc]"]
cli = ["click"]
# patchelf: Nuitka needs it for RPATH rewrites in standalone/onefile mode on Linux;
# bundling a known-good build keeps smelt self-contained rather than relying on the
# host distro's version. Capped below 0.18 because Nuitka blacklists patchelf 0.18.0
# (a buggy upstream release); the 0.17.2.x line is the current good stable series.
# nuitka: capped below 4.2 -- smelt's shared-runtime build (nuitkaify.py) patches
# Nuitka's generated `HelpersConstantsBlob.c`/`constants_blob.h` by exact source-text
# match; Nuitka 4.2 changed `loadConstantsBlob`'s signature (return type and the blob
# symbol naming), breaking that match. Raise the cap once the patch is updated for it.
nuitka = ["nuitka<4.2", "patchelf>=0.17.2,<0.18; sys_platform == 'linux'"]
cython = ["Cython"]
# metapython: builds smelt's own CPython (static libc/openssl/zlib/libffi) via Zig,
# for standalone Nuitka builds with no dependency on the host's libc/distro at all --
# see nuitkaify.py's `assemble_standalone_dist`. Pinned to a commit, not a branch:
# the vendored `cpython`/`build.zig` bundled in its wheel is exactly what gets built,
# so a floating ref would make smelt builds non-reproducible across installs.
# NOTE: this pin predates the build.zig fixes `own_python` now depends on (release
# builds failing on -Werror=date-time; missing -DPLATFORM/-DABIFLAGS, which produce an
# interpreter reporting sys.platform == "unknown"). Bump it once those are on master --
# see roadmap.md. Until then `own_python` needs a local meta-python checkout.
metapython = ["metapython @ git+ssh://git@github.com/Hedwyn/meta-python.git@18b3e4e"]
build = [
  "Cython",
  "nuitka[onefile]<4.2",
  "patchelf>=0.17.2,<0.18; sys_platform == 'linux'",
  "mypy[mypyc]",
  "hatchling",
  "editables",
  "metapython @ git+ssh://git@github.com/Hedwyn/meta-python.git@18b3e4e",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools_scm]

[tool.setuptools.package-data]
# There's on pyconfig.h per platform + python combination
# Path is pyconfig/platform/python/pyconfig.h
"smelt.pyconfig" = ["*/*/pyconfig.h"]

[project.entry-points.hatch]
smelt = "smelt.build_backends.hatch"
