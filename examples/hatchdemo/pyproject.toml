[build-system]
requires = ["hatchling", "smelt", "mypy[mypyc]"]
build-backend = "hatchling.build"

[project]
name = "smelt-hatchling-demo"
version = "0.1.0"
description = "A minimal package setup using smelt + hatchling hook"
requires-python = ">=3.12"
authors = [{ name = "Baptiste Pestourie" }]
dependencies = ["click"]

[project.scripts]
hatchdemo = "hatchdemo.cli:hatchdemo"

[tool.hatch.build.targets.wheel]
packages = ["src/hatchdemo"]

[tool.hatch.build.hooks.smelt]

[tool.smelt]
package-dirs = { "hatchdemo" = "src/hatchdemo" }

[[tool.smelt.mypyc_modules]]
import_path = "hatchdemo.fib"

[[tool.smelt.nuitka_modules]]
import_path = "hatchdemo.cli"

[[tool.smelt.c_extensions]]
import_path = "hatchdemo.hello"
sources = ["src/hatchdemo/hello.c"]

[[tool.smelt.c_extensions]]
import_path = "hatchdemo.zighello"
sources = ["src/hatchdemo/zighello.zig"]

[[tool.smelt.cython_modules]]
import_path = "hatchdemo.fib_cython"
source = "src/hatchdemo/fib_cython.pyx"
