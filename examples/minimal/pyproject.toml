[project]
name = "smelt-minimal-demo"
version = "0.1.0"
description = "A minimalist package setup using smelt"
requires-python = ">=3.12"
authors = [{ name = "Baptiste Pestourie" }]
dependencies = ["click"]

[project.scripts]
minimal-demo = "minimal.cli:minimal"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.smelt]

# One array-of-tables entry per module, each naming the module it produces and the
# source it is built from. `[project.scripts]` above is what declares the entrypoint --
# smelt picks every one of them up on its own.

[[tool.smelt.c_extensions]]
import_path = "minimal.hello"
sources = ["src/minimal/hello.c"]

[[tool.smelt.mypyc_modules]]
import_path = "minimal.fib"
source = "src/minimal/fib.py"

# Two cython modules, and deliberately from two different kinds of source: the same
# pure-python `fib.py` that mypyc compiles above, and a real `.pyx`.
[[tool.smelt.cython_modules]]
import_path = "minimal.fib_cython_nopyx"
source = "src/minimal/fib.py"

[[tool.smelt.cython_modules]]
import_path = "minimal.fib_cython"
source = "src/minimal/fib_cython.pyx"
